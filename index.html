<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Swing</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: #05070f;
    font-family: Arial, Helvetica, sans-serif;
    color: #9fb0ff;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 12px;
  }

  h1 {
    margin: 0;
    font-size: 22px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #d6202b;
  }

  #stage {
    width: 100%;
    max-width: 1000px;
    aspect-ratio: 1000 / 700;
    border-radius: 14px;
    box-shadow: 0 0 40px rgba(214, 32, 43, 0.35);
    overflow: hidden;
    touch-action: manipulation;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  p {
    margin: 0;
    font-size: 14px;
    opacity: 0.8;
  }
</style>
</head>
<body>

<h1>Web Swing</h1>
<div id="stage"><canvas id="c" width="1000" height="700"></canvas></div>
<p>Click (or tap) the white web to make him fall.</p>

<script>
(function () {
  const W = 1000, H = 700;
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");

  // Coordinates below use "turtle style": (0,0) is the center, y goes UP.
  const X = (x) => x + W / 2;
  const Y = (y) => H / 2 - y;

  // ---------- seeded random so the city is always the same ----------
  let seed = 7;
  function rnd() {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const randint = (a, b) => Math.floor(rnd() * (b - a + 1)) + a;
  const choice = (arr) => arr[Math.floor(rnd() * arr.length)];

  // ---------- static city background (drawn once on a hidden canvas) ----------
  const bgCanvas = document.createElement("canvas");
  bgCanvas.width = W; bgCanvas.height = H;
  const bg = bgCanvas.getContext("2d");

  function bgDot(x, y, size, color) {
    bg.fillStyle = color;
    bg.beginPath();
    bg.arc(X(x), Y(y), size / 2, 0, Math.PI * 2);
    bg.fill();
  }

  function drawCity() {
    bg.fillStyle = "#0b1026";
    bg.fillRect(0, 0, W, H);

    for (let i = 0; i < 120; i++) {
      bgDot(randint(-500, 500), randint(-100, 350), choice([2, 2, 3]), "#cfd8ff");
    }
    bgDot(250, 280, 60, "#f4f1de");            // moon

    let x = -500;
    while (x < 500) {
      const w = randint(60, 110);
      const h = randint(120, 300);
      bg.fillStyle = choice(["#141a3a", "#1a2147", "#10152f"]);
      bg.fillRect(X(x), Y(-350 + h), w, h);
      for (let wy = -330; wy < -350 + h - 15; wy += 28) {
        for (let wx = x + 12; wx < x + w - 10; wx += 22) {
          if (rnd() < 0.45) bgDot(wx, wy, 7, "#ffd86b");
        }
      }
      x += w + 4;
    }
  }
  drawCity();

  // ---------- drawing helpers ----------
  function line(x1, y1, x2, y2, width, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(X(x1), Y(y1));
    ctx.lineTo(X(x2), Y(y2));
    ctx.stroke();
  }

  function dot(x, y, size, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(X(x), Y(y), size / 2, 0, Math.PI * 2);
    ctx.fill();
  }

  const RED = "#d6202b", BLUE = "#1e3a8a";

  // hx,hy = hands position, a = body angle (0 = hanging straight down)
  function drawHero(hx, hy, a, kick) {
    const dx = Math.sin(a), dy = -Math.cos(a);   // along the body
    const px = Math.cos(a), py = Math.sin(a);    // sideways
    const P = (u, v) => [hx + u * dx + v * px, hy + u * dy + v * py];

    function seg(u1, v1, u2, v2, width, color) {
      const [ax, ay] = P(u1, v1);
      const [bx, by] = P(u2, v2);
      line(ax, ay, bx, by, width, color);
    }
    function blob(u, v, size, color) {
      const [x, y] = P(u, v);
      dot(x, y, size, color);
    }

    seg(35, 0, 0, -6, 6, RED);                   // arms
    seg(35, 0, 0, 6, 6, RED);
    seg(85, 0, 135, -14 + kick, 8, BLUE);        // legs
    seg(85, 0, 135, 14 - kick, 8, BLUE);
    seg(35, 0, 85, 0, 20, RED);                  // torso
    seg(40, 0, 82, 0, 8, BLUE);
    blob(22, 0, 30, RED);                        // head
    blob(21, -7, 9, "white");                    // eyes
    blob(21, 7, 9, "white");
    blob(36, 0, 8, "black");                     // chest mark
  }

  // ---------- state ----------
  let timeStep = 0;
  const S = {
    mode: "swing",                 // "swing" or "fall"
    web: [0, 330, 0, 0],           // ax, ay, hx, hy
    x: 0, y: 0, vx: 0, vy: 0,
    a: 0, spin: 0, landed: false, t: 0
  };

  function distToSegment(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    let t = ((px - x1) * dx + (py - y1) * dy) / (dx * dx + dy * dy);
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
  }

  // mouse/touch position -> turtle-style coordinates
  function toWorld(e) {
    const r = canvas.getBoundingClientRect();
    return [
      (e.clientX - r.left) * (W / r.width) - W / 2,
      H / 2 - (e.clientY - r.top) * (H / r.height)
    ];
  }

  function onWeb(e, tolerance) {
    const [cx, cy] = toWorld(e);
    const [ax, ay, hx, hy] = S.web;
    return distToSegment(cx, cy, ax, ay, hx, hy) < tolerance;
  }

  canvas.addEventListener("pointerdown", (e) => {
    if (S.mode !== "swing") return;
    const tolerance = e.pointerType === "touch" ? 32 : 18;
    if (onWeb(e, tolerance)) {
      const [, , hx, hy] = S.web;
      S.mode = "fall";
      S.x = hx; S.y = hy;
      S.vx = Math.random() < 0.5 ? -4 : 4;
      S.vy = 0;
      S.spin = Math.random() < 0.5 ? -0.18 : 0.18;
      S.landed = false;
      S.t = 0;
    }
  });

  canvas.addEventListener("pointermove", (e) => {
    canvas.style.cursor = (S.mode === "swing" && onWeb(e, 18)) ? "pointer" : "default";
  });

  // ---------- one animation step (60 per second) ----------
  function step() {
    timeStep += 0.035;

    if (S.mode === "swing") {
      const ax = 220 * Math.sin(timeStep / 2), ay = 330;
      const swing = 0.75 * Math.sin(timeStep);
      const L = 330;
      const hx = ax + L * Math.sin(swing);
      const hy = ay - L * Math.cos(swing);
      S.web = [ax, ay, hx, hy];
      S.a = swing;
    } else {
      S.t += 1;
      if (!S.landed) {
        S.vy -= 0.7;
        S.x += S.vx;
        S.y += S.vy;
        S.a += S.spin;
        if (S.y < -290) {
          S.y = -290;
          S.a = Math.PI / 2;                     // lying flat
          S.landed = true;
        }
      }
      if (S.t > 200) S.mode = "swing";           // back to swinging
    }
  }

  function render() {
    ctx.drawImage(bgCanvas, 0, 0);

    if (S.mode === "swing") {
      const [ax, ay, hx, hy] = S.web;
      line(ax, ay, hx, hy, 2, "white");
      dot(ax, ay, 8, "white");
      drawHero(hx, hy, S.a, 14 * Math.sin(timeStep * 2));

      ctx.fillStyle = "#9fb0ff";
      ctx.font = "14px Arial";
      ctx.textAlign = "center";
      ctx.fillText("Click the web!", X(0), Y(300) + 5);
    } else {
      drawHero(S.x, S.y, S.a, 0);

      // popup text grows quickly, then stays
      const size = Math.min(46, 10 + S.t * 3);
      const tx = Math.max(-350, Math.min(350, S.x));
      const ty = Math.min(230, S.y + 120);
      ctx.fillStyle = "#ff3b3b";
      ctx.font = "bold " + Math.floor(size) + "px Arial";
      ctx.textAlign = "center";
      ctx.fillText("Fu*k off", X(tx), Y(ty));
    }
  }

  // fixed 60 steps per second, even on 120/144 Hz screens
  let last = performance.now(), acc = 0;
  function loop(now) {
    acc += Math.min(now - last, 100);
    last = now;
    while (acc >= 16) { step(); acc -= 16; }
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
